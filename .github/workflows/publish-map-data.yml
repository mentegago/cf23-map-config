name: Publish map data

on:
  push:
    branches: [master]
    paths:
      - 'data/map.json'
      - 'scripts/generate_booth_proximity.py'
      - 'scripts/publish_map_data.py'
      - 'scripts/publish_map_data_test.py'
      - '.github/workflows/publish-map-data.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test map generation and publication
        run: python -m unittest discover -s scripts -p '*_test.py'
      - name: Generate distances and map snapshot
        run: python scripts/publish_map_data.py
      - name: Commit generated map publication
        run: |
          if [ -n "$(git status --porcelain -- public/manifest.json public/maps)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/manifest.json public/maps
            git commit -m "data: publish map update"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
