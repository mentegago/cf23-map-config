name: Publish manual exhibitors

on:
  push:
    branches: [master]
    paths:
      - 'data/manual/**'
      - 'public/images/**'
      - 'scripts/lib/manual-exhibitors.ts'
      - 'scripts/remap.ts'
      - '.github/workflows/publish-manual-data.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/_refresh-data.yml
    with:
      download_catalog: false
      refresh_fandoms: true
      force_deploy: true
    secrets:
      FANDOM_DIRECTORY_API_KEY: ${{ secrets.FANDOM_DIRECTORY_API_KEY }}
