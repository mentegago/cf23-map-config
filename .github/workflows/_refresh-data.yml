name: Reusable data refresh

on:
  workflow_call:
    inputs:
      download_catalog:
        description: Download and replace the raw catalog before mapping
        required: true
        type: boolean
      force_deploy:
        description: Deploy committed manual images even when generated JSON is unchanged
        required: false
        default: false
        type: boolean
      refresh_fandoms:
        description: Refresh the fandom registry and submit unknown fandom fields
        required: false
        default: true
        type: boolean
    secrets:
      FANDOM_DIRECTORY_API_KEY:
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued refresh must include commits made by the preceding publisher.
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile

      - name: Download fresh catalog snapshot
        if: inputs.download_catalog
        run: bun run snapshot:catalog

      - run: bun run typecheck
      - run: bun test
      - run: bun run test:map

      - name: Process catalog and manual data
        run: bun run build
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          REFRESH_FANDOMS: ${{ inputs.refresh_fandoms }}
          FANDOM_DIRECTORY_API_KEY: ${{ secrets.FANDOM_DIRECTORY_API_KEY }}

      - name: Commit refreshed source and public data
        id: changes
        env:
          COMMIT_MESSAGE: "${{ inputs.download_catalog && 'data: full refresh' || (inputs.refresh_fandoms && 'data: refresh fandom mapping' || 'data: publish manual updates') }}"
        run: |
          if [ -z "$(git status --porcelain -- public)" ]; then
            echo "public_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "public_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$(git status --porcelain -- data public)" ]; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data public
            git commit -m "$COMMIT_MESSAGE"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.public_changed == 'true' || inputs.force_deploy
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.public_changed == 'true' || inputs.force_deploy
        with:
          path: public
      - name: Deploy GitHub Pages
        if: steps.changes.outputs.public_changed == 'true' || inputs.force_deploy
        uses: actions/deploy-pages@v4
        id: deployment
